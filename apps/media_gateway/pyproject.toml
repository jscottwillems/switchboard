[project]
name = "switchboard-media-gateway"
version = "0.1.0"
description = "Media WebSocket edge. Owner: ECHO. Hot path calls LOKI's ResponseSelector."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["switchboard_media"]
