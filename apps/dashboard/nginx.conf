# Keep a proto the TLS edge already set. Direct LAN HTTP has no header, so use $scheme.
map $http_x_forwarded_proto $switchboard_forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker DNS. A variable in proxy_pass re-resolves after the API container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /v1/ {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $switchboard_forwarded_proto;
        proxy_set_header X-Switchboard-Operator-Token $http_x_switchboard_operator_token;
        proxy_set_header Authorization $http_authorization;
    }

    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
