[project]
name = "switchboard-intelligence"
version = "0.1.0"
description = "Async extraction and correlation process. Owners: SHERLOCK and WATSON."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["switchboard_intelligence"]
