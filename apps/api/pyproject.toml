[project]
name = "switchboard-api"
version = "0.1.0"
description = "Control-plane HTTP API. Session lifecycle and read models."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["switchboard_api"]
