[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "switchboard-watson"
version = "0.1.0"
description = "Deterministic campaign-association scoring for Project Switchboard (WATSON)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
watson = "watson.cli:main"

[tool.setuptools.packages.find]
include = ["watson*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/schemas"]
