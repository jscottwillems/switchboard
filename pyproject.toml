[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "switchboard"
version = "0.1.0"
description = "Operator-controlled scam-call honeypot telephony slice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anyio>=4",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "uvicorn[standard]>=0.32",
  "websockets>=13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[project.scripts]
switchboard-simulate = "switchboard.simulator.__main__:main"

[tool.setuptools.packages.find]
include = ["switchboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
