# Slice 1 runs the API only. Session state is in-memory on purpose.
# See docs/DECISIONS.md ADR-001. Redis and Postgres are not required yet.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      SWITCHBOARD_PUBLIC_BASE_URL: http://localhost:8000
      SWITCHBOARD_MEDIA_WS_BASE_URL: ws://localhost:8000
      SWITCHBOARD_MOCK_WEBHOOK_SECRET: dev-mock-secret
      SWITCHBOARD_LOG_LEVEL: INFO
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
