[project]
name = "switchboard-events"
version = "0.1.0"
description = "Redis stream publish and consumer groups for switchboard.events. Owner: ATLAS."
requires-python = ">=3.12"
dependencies = [
  "redis>=5",
  "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["switchboard_events"]
