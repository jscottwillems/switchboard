[project]
name = "switchboard-conversation"
version = "0.1.0"
description = "Honeypot response-selection port. Owner: LOKI."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "switchboard-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["switchboard_conversation"]
