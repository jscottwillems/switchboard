[project]
name = "switchboard-classification"
version = "0.1.0"
description = "Extraction and correlation ports. Owners: SHERLOCK and WATSON."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "switchboard-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["switchboard_classification"]
