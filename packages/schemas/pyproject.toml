[project]
name = "switchboard-schemas"
version = "0.1.0"
description = "Canonical contracts for Project Switchboard. Pydantic models are the machine-readable source of truth."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["switchboard_schemas"]
