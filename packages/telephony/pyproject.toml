[project]
name = "switchboard-telephony"
version = "0.1.0"
description = "Carrier adapter ports. Owner: BELL. Mock verifier and VoiceInstruction renderer."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["switchboard_telephony"]
