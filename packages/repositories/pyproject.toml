[project]
name = "switchboard-repositories"
version = "0.1.0"
description = "Postgres repositories for ops, obs, interp, and attr. Owner: ATLAS."
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["switchboard_repositories"]
